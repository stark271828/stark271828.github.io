- date: "2026-10-01"
  text: "Our paper on a data-driven model for predicting the dynamic output impedance of current-limited grid-forming inverters was accepted for IEEE APEC 2027."
- date: "2026-10-01"  
  text: "Our paper on using a novel T-type solid-state HVDC ircuit breaker to suppress transient inrush current was accepted for IEEE APEC 2027."
- date: "2026-08-01"
  text: "Our summer intern Helen Ly presented her research on a data-driven model for predicting the dynamic output impedance of current-limited grid-forming inverters at the SULI poster session."
