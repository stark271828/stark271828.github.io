<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<script
  data-goatcounter="https://brianyang1995.goatcounter.com/count"
  async
  src="https://gc.zgo.at/count.js">
</script>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.url == '/' %}{{ page.title | escape }} · {% endunless %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% if site.url != '' %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" sizes="any"
      href="{{ '/assets/img/icon_website_title.svg' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">  <strong>Bowen</strong> Yang </a>
      <nav aria-label="Main navigation">
        {% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>{% endfor %}
      </nav>
    </div>
  </header>
  <main id="main" class="container">{{ content }}</main>
  <footer class="site-footer"><div class="container">© {{ 'now' | date: '%Y' }} {{ site.title | escape }} · Built with Jekyll · Adapted from <a href="https://github.com/alshedivat/al-folio">al-folio</a></div></footer>
</body>
</html>
