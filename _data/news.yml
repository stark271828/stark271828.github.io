  text: "Our graduate intern Billah Al Raji presented his summer research on a T-type solid-state HVDC circuit breaker at the NLR-PSEC summer intern seminar."
- date: "2026-07-01"
  text: "I joined the AI Foundation Series hosted by the NLR Computational Science Center and enjoyed discussions about the Genesis Mission and how AI could shape future research."
- date: "2026-06-01"
  text: "I joined the Workshop on Grid Integration of Grid-Forming BESS into Modern Power Systems, hosted by the Integration of Renewable & Distributed Energy Resources (IRED) Conference committee, and enjoyed hearing different perspectives on grid-forming capabilities in battery energy storage systems."
- date: "2026-06-01"
  text: "We welcomed Helen Ly from the University of Rhode Island as a summer intern through the DOE SULI program."
